name = "zure"
main = "src/worker.js"
compatibility_date = "2025-05-01"

# 画面（HTML/CSS/JS）は public/ をそのまま配信する
[assets]
directory = "./public"
binding = "ASSETS"

# 部屋ごとに1つのDurable Objectを作り、そこに全員の状態を集める
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 無料プランで使える SQLite バックエンドの Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
